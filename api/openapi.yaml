openapi: 3.1.0
info:
  title: DailyCanvas API
  version: 1.0.0
  summary: API for the DailyCanvas application
  description: |
    API for the DailyCanvas application. The API covers the home screen,
    calendar, artwork catalog, favorites, user settings, authentication,
    profile, tags, and notification status.
servers:
  - url: /api/v1
    description: Base API path
security:
  - bearerAuth: []
tags:
  - name: Main
    description: Home screen and artwork-of-the-day interactions
  - name: Gallery
    description: Artwork browsing and search
  - name: Favorites
    description: Favorite artworks management
  - name: Settings
    description: User settings
  - name: Auth
    description: Authentication and session management
  - name: Profile
    description: User profile
  - name: Tags
    description: Tags and filters
  - name: Notifications
    description: Notification state
paths:
  /main:
    get:
      tags: [Main]
      summary: Get home screen data
      description: Returns the artwork of the day, selected collections, and today's viewing/notification state.
      operationId: getMain
      responses:
        '200':
          description: Home screen payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MainResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /calendar:
    get:
      tags: [Main]
      summary: Get artwork calendar
      description: Returns this user's persisted daily artwork assignments for the requested date range.
      operationId: getCalendar
      parameters:
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
      responses:
        '200':
          description: Calendar entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /main/view:
    post:
      tags: [Main]
      summary: Mark the artwork of the day as viewed
      description: Called when the user opens the main artwork of the day.
      operationId: markTodayArtworkViewed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MainViewRequest'
      responses:
        '200':
          description: View state updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MainViewResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /artworks/gallery:
    get:
      tags: [Gallery]
      summary: Get gallery artworks
      description: Returns a paginated list of artworks with optional collection and tag filters.
      operationId: getGalleryArtworks
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: collection
          in: query
          description: Filter artworks by collection.
          schema:
            $ref: '#/components/schemas/Collection'
        - name: tagId
          in: query
          description: Filter artworks by tag identifier.
          schema:
            type: string
      responses:
        '200':
          description: Gallery results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GalleryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /artworks/search:
    get:
      tags: [Gallery]
      summary: Search artworks
      description: Searches by artist, title, tags, and description with pagination support.
      operationId: searchArtworks
      parameters:
        - name: q
          in: query
          required: true
          description: Search query.
          schema:
            type: string
            minLength: 1
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /artworks/{artworkId}:
    get:
      tags: [Gallery]
      summary: Get artwork details
      description: Returns full information about a single artwork.
      operationId: getArtworkById
      parameters:
        - $ref: '#/components/parameters/ArtworkId'
      responses:
        '200':
          description: Artwork details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtworkDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /favorites:
    get:
      tags: [Favorites]
      summary: Get favorite artworks
      description: Returns a paginated list of the user's favorite artworks.
      operationId: getFavorites
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: q
          in: query
          description: Search within favorites.
          schema:
            type: string
        - name: sort
          in: query
          description: Sorting mode.
          schema:
            $ref: '#/components/schemas/FavoritesSort'
      responses:
        '200':
          description: Favorite artworks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FavoritesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Favorites]
      summary: Add artwork to favorites
      description: Adds an artwork to favorites. Re-adding an already favorite artwork returns `409 Conflict`.
      operationId: addFavorite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FavoriteMutationRequest'
      responses:
        '201':
          description: Artwork added to favorites
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FavoriteAddedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /favorites/{artworkId}:
    delete:
      tags: [Favorites]
      summary: Remove artwork from favorites
      operationId: removeFavorite
      parameters:
        - $ref: '#/components/parameters/ArtworkId'
      responses:
        '200':
          description: Artwork removed from favorites
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FavoriteRemovedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /settings:
    get:
      tags: [Settings]
      summary: Get user settings
      operationId: getSettings
      responses:
        '200':
          description: User settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags: [Settings]
      summary: Update user settings
      description: Updates selected collections and notification settings.
      operationId: updateSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingsPatch'
      responses:
        '200':
          description: Updated user settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a user
      security: []
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: Registration successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/login:
    post:
      tags: [Auth]
      summary: Log in
      security: []
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/token/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token
      security: []
      operationId: refreshAccessToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Tokens refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshTokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/logout:
    post:
      tags: [Auth]
      summary: Log out
      operationId: logoutUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /users/me:
    get:
      tags: [Profile]
      summary: Get current user profile
      operationId: getCurrentUser
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Profile]
      summary: Delete the current user account
      operationId: deleteCurrentUser
      responses:
        '200':
          description: Account deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /users/me/password:
    patch:
      tags: [Profile]
      summary: Change the current user's password
      operationId: changeCurrentUserPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Password changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /tags:
    get:
      tags: [Tags]
      summary: Get tags
      description: Returns available tags for filtering and search.
      operationId: getTags
      responses:
        '200':
          description: Tag list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /notifications/today-status:
    get:
      tags: [Notifications]
      summary: Get today's notification status
      description: Deprecated. Use the `todayStatus` field from `GET /main`.
      deprecated: true
      operationId: getTodayNotificationStatus
      responses:
        '200':
          description: Notification status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodayStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ArtworkId:
      name: artworkId
      in: path
      required: true
      description: Artwork identifier.
      schema:
        type: string
        example: ninth-wave
    Page:
      name: page
      in: query
      description: Page number.
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      description: Number of items per page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    DateFrom:
      name: from
      in: query
      description: Inclusive start of the calendar range. Must be used together with `to`.
      schema:
        type: string
        format: date
        example: '2026-07-01'
    DateTo:
      name: to
      in: query
      description: Inclusive end of the calendar range. Must be used together with `from` and must not be earlier than it.
      schema:
        type: string
        format: date
        example: '2026-07-31'
  responses:
    BadRequest:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalidRequest:
              value:
                code: bad_request
                message: Request validation failed
    Unauthorized:
      description: Authentication is missing, invalid, or expired
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            unauthorized:
              value:
                code: unauthorized
                message: Access token is missing, invalid, or expired
    Conflict:
      description: The request conflicts with the current state of the resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            alreadyExists:
              value:
                code: conflict
                message: Resource state conflict
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            serverError:
              value:
                code: internal_error
                message: Internal server error
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    Collection:
      type: string
      enum: [russian, world]
    TagType:
      type: string
      enum: [genre, style, period, collection]
      x-enum-varnames: [TagTypeGenre, TagTypeStyle, TagTypePeriod, TagTypeCollection]
    FavoritesSort:
      type: string
      enum: [recently_added, title, year, artist]
    Artist:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: string
          example: ivan-aivazovsky
        name:
          type: string
          example: Иван Айвазовский
    Tag:
      type: object
      additionalProperties: false
      required: [id, name, type]
      properties:
        id:
          type: string
          example: seascape
        name:
          type: string
          example: Морской пейзаж
        type:
          $ref: '#/components/schemas/TagType'
    ArtworkFocusPoint:
      type: object
      additionalProperties: false
      required: [x, y]
      description: Normalized point that must remain visible when the image is cropped.
      properties:
        x:
          type: number
          format: double
          minimum: 0
          maximum: 1
          example: 0.5
        y:
          type: number
          format: double
          minimum: 0
          maximum: 1
          example: 0.35
    ArtworkSummary:
      type: object
      additionalProperties: false
      required: [id, title, artist, country, year, imageUrl, focusPoint]
      properties:
        id:
          type: string
          example: ninth-wave
        title:
          type: string
          example: Девятый вал
        artist:
          $ref: '#/components/schemas/Artist'
        country:
          type: string
          example: Россия
        year:
          type: integer
          example: 1850
        imageUrl:
          type: string
          format: uri
          example: https://cdn.example.com/artworks/ninth-wave.webp
        focusPoint:
          $ref: '#/components/schemas/ArtworkFocusPoint'
        isFavorite:
          type: boolean
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
    ArtworkDetail:
      type: object
      additionalProperties: false
      required: [id, title, artist, country, year, imageUrl, focusPoint, description, facts, collection]
      properties:
        id:
          type: string
          example: ninth-wave
        title:
          type: string
          example: Девятый вал
        artist:
          $ref: '#/components/schemas/Artist'
        country:
          type: string
          example: Россия
        year:
          type: integer
          example: 1850
        imageUrl:
          type: string
          format: uri
          example: https://cdn.example.com/artworks/ninth-wave.webp
        focusPoint:
          $ref: '#/components/schemas/ArtworkFocusPoint'
        isFavorite:
          type: boolean
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
        description:
          type: string
        facts:
          type: array
          items:
            type: string
        collection:
          $ref: '#/components/schemas/Collection'
    TodayArtwork:
      $ref: '#/components/schemas/ArtworkDetail'
    TodayStatus:
      type: object
      additionalProperties: false
      required: [hasViewedToday, shouldNotify, message]
      properties:
        hasViewedToday:
          type: boolean
          example: false
        shouldNotify:
          type: boolean
          example: true
        message:
          type: string
          example: Сегодня вас ждёт новая картина дня.
    MainResponse:
      type: object
      additionalProperties: false
      required: [date, selectedCollections, todayArtwork, todayStatus]
      properties:
        date:
          type: string
          format: date
          example: '2026-07-02'
        selectedCollections:
          type: array
          items:
            $ref: '#/components/schemas/Collection'
        todayArtwork:
          $ref: '#/components/schemas/TodayArtwork'
        todayStatus:
          $ref: '#/components/schemas/TodayStatus'
    CalendarItem:
      type: object
      additionalProperties: false
      required: [date, artworkId, imageUrl, focusPoint]
      properties:
        date:
          type: string
          format: date
          example: '2026-07-03'
        artworkId:
          type: string
          example: ninth-wave
        imageUrl:
          type: string
          format: uri
          example: https://cdn.example.com/artworks/ninth-wave.webp
        focusPoint:
          $ref: '#/components/schemas/ArtworkFocusPoint'
    CalendarResponse:
      type: object
      additionalProperties: false
      required: [from, to, items]
      properties:
        from:
          type: string
          format: date
          example: '2026-07-01'
        to:
          type: string
          format: date
          example: '2026-07-31'
        items:
          type: array
          items:
            $ref: '#/components/schemas/CalendarItem'
    MainViewRequest:
      type: object
      additionalProperties: false
      required: [artworkId, date]
      properties:
        artworkId:
          type: string
          example: ninth-wave
        date:
          type: string
          format: date
          example: '2026-07-02'
    MainViewResponse:
      type: object
      additionalProperties: false
      required: [success, hasViewedToday]
      properties:
        success:
          type: boolean
          example: true
        hasViewedToday:
          type: boolean
          example: true
    Pagination:
      type: object
      additionalProperties: false
      required: [page, limit, total]
      properties:
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
    GalleryResponse:
      type: object
      additionalProperties: false
      required: [items, pagination]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ArtworkSummary'
        pagination:
          $ref: '#/components/schemas/Pagination'
    SearchMatchField:
      type: string
      enum: [artist, title, tags, description]
    SearchArtworkItem:
      type: object
      additionalProperties: false
      required: [id, title, artist, year, imageUrl, focusPoint, matchedBy]
      properties:
        id:
          type: string
          example: ninth-wave
        title:
          type: string
          example: Девятый вал
        artist:
          $ref: '#/components/schemas/Artist'
        year:
          type: integer
          example: 1850
        imageUrl:
          type: string
          format: uri
          example: https://cdn.example.com/artworks/ninth-wave.webp
        focusPoint:
          $ref: '#/components/schemas/ArtworkFocusPoint'
        isFavorite:
          type: boolean
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
        matchedBy:
          type: array
          items:
            $ref: '#/components/schemas/SearchMatchField'
    SearchResponse:
      type: object
      additionalProperties: false
      required: [items, pagination]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SearchArtworkItem'
        pagination:
          $ref: '#/components/schemas/Pagination'
    FavoriteArtworkItem:
      type: object
      additionalProperties: false
      required: [id, title, artist, country, year, imageUrl, focusPoint, addedAt]
      properties:
        id:
          type: string
          example: ninth-wave
        title:
          type: string
          example: Девятый вал
        artist:
          $ref: '#/components/schemas/Artist'
        country:
          type: string
          example: Россия
        year:
          type: integer
          example: 1850
        imageUrl:
          type: string
          format: uri
          example: https://cdn.example.com/artworks/ninth-wave.webp
        focusPoint:
          $ref: '#/components/schemas/ArtworkFocusPoint'
        isFavorite:
          type: boolean
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
        addedAt:
          type: string
          format: date-time
          example: '2026-07-02T12:30:00Z'
    FavoritesResponse:
      type: object
      additionalProperties: false
      required: [items, pagination]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FavoriteArtworkItem'
        pagination:
          $ref: '#/components/schemas/Pagination'
    FavoriteMutationRequest:
      type: object
      additionalProperties: false
      required: [artworkId]
      properties:
        artworkId:
          type: string
          example: ninth-wave
    FavoriteAddedResponse:
      type: object
      additionalProperties: false
      required: [success, artworkId, isFavorite]
      properties:
        success:
          type: boolean
          example: true
        artworkId:
          type: string
          example: ninth-wave
        isFavorite:
          type: boolean
          example: true
    FavoriteRemovedResponse:
      type: object
      additionalProperties: false
      required: [success, artworkId, isFavorite]
      properties:
        success:
          type: boolean
          example: true
        artworkId:
          type: string
          example: ninth-wave
        isFavorite:
          type: boolean
          const: false
    NotificationSettings:
      type: object
      additionalProperties: false
      required: [enabled, time, timeZone]
      properties:
        enabled:
          type: boolean
          example: true
        time:
          type: string
          pattern: '^([01]\\d|2[0-3]):[0-5]\\d$'
          example: '20:00'
        timeZone:
          type: string
          description: IANA time zone used to interpret `time`.
          example: Europe/Moscow
    NotificationSettingsPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        enabled:
          type: boolean
          example: true
        time:
          type: string
          pattern: '^([01]\\d|2[0-3]):[0-5]\\d$'
          example: '20:00'
        timeZone:
          type: string
          description: IANA time zone used to interpret `time`.
          example: Europe/Moscow
    Settings:
      type: object
      additionalProperties: false
      required: [selectedCollections, notifications]
      properties:
        selectedCollections:
          type: array
          items:
            $ref: '#/components/schemas/Collection'
        notifications:
          $ref: '#/components/schemas/NotificationSettings'
    SettingsPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        selectedCollections:
          type: array
          items:
            $ref: '#/components/schemas/Collection'
        notifications:
          $ref: '#/components/schemas/NotificationSettingsPatch'
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          format: password
          minLength: 8
          example: StrongPassword123
        name:
          type: string
          minLength: 1
          maxLength: 100
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    UserProfile:
      type: object
      additionalProperties: false
      required: [id, email]
      properties:
        id:
          type: string
          example: user-1
        email:
          type: string
          format: email
          example: user@example.com
        createdAt:
          type: string
          format: date-time
          example: '2026-07-02T12:30:00Z'
        name:
          type: string
          example: Анна
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          format: password
        newPassword:
          type: string
          format: password
          minLength: 8
    AuthResponse:
      type: object
      additionalProperties: false
      required: [accessToken, refreshToken, tokenType, accessTokenExpiresIn, refreshTokenExpiresIn, user]
      properties:
        accessToken:
          type: string
          example: jwt-access-token
        refreshToken:
          type: string
          example: jwt-refresh-token
        tokenType:
          type: string
          example: Bearer
        accessTokenExpiresIn:
          type: integer
          description: Access token lifetime in seconds.
          minimum: 1
          example: 3600
        refreshTokenExpiresIn:
          type: integer
          description: Refresh token lifetime in seconds.
          minimum: 1
          example: 2592000
        user:
          $ref: '#/components/schemas/UserProfile'
    RefreshTokenRequest:
      type: object
      additionalProperties: false
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          example: jwt-refresh-token
    RefreshTokenResponse:
      type: object
      additionalProperties: false
      required: [accessToken, refreshToken, tokenType, accessTokenExpiresIn, refreshTokenExpiresIn]
      properties:
        accessToken:
          type: string
          example: new-jwt-access-token
        refreshToken:
          type: string
          example: new-jwt-refresh-token
        tokenType:
          type: string
          example: Bearer
        accessTokenExpiresIn:
          type: integer
          description: Access token lifetime in seconds.
          minimum: 1
          example: 3600
        refreshTokenExpiresIn:
          type: integer
          description: Refresh token lifetime in seconds.
          minimum: 1
          example: 2592000
    SuccessResponse:
      type: object
      additionalProperties: false
      required: [success]
      properties:
        success:
          type: boolean
          example: true
    TagsResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
    NotificationStatusResponse:
      $ref: '#/components/schemas/TodayStatus'
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          example: not_found
        message:
          type: string
          example: Resource not found
        details:
          type: array
          items:
            type: string
