services:
  postgres:
    image: postgres:17-alpine
    container_name: dailycanvas-postgres
    environment:
      POSTGRES_DB: dailycanvas
      POSTGRES_USER: dailycanvas
      POSTGRES_PASSWORD: dailycanvas
    ports:
      - "127.0.0.1:37432:5432"
    volumes:
      - dailycanvas-postgres-data:/var/lib/postgresql/data

  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: dailycanvas-api
    depends_on:
      - postgres
    environment:
      APP_PORT: 37117
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: dailycanvas
      POSTGRES_USER: dailycanvas
      POSTGRES_PASSWORD: dailycanvas
      POSTGRES_SSLMODE: disable
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?AUTH_JWT_SECRET must be set in backend/.env}
      WEB_DIR: /app/frontend
      PUBLIC_BASE_URL: http://localhost:37117
      IMAGES_DIR: /app/local-data/artworks/images
      ARTWORK_CATALOG_PATH: /app/local-data/artworks/catalog.json
      MIGRATIONS_DIR: /app/backend/migrations
    ports:
      - "127.0.0.1:37117:37117"
    volumes:
      - ../local-data/artworks:/app/local-data/artworks:ro

volumes:
  dailycanvas-postgres-data:
